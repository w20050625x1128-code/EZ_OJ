<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>操作系统 OJ 在线评测</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 全局导航栏 */
        header {
            padding: 16px 24px;
            background: #020617;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        header .logo {
            font-size: 18px;
            font-weight: 600;
            color: #f9fafb;
            cursor: pointer;
        }
        header .auth-area {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        header .user-name {
            color: #38bdf8;
            cursor: pointer;
            font-weight: 500;
        }
        /* 按钮通用样式 */
        button {
            border-radius: 999px;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
        }
        .btn-primary {
            background: linear-gradient(to right, #38bdf8, #0ea5e9);
            color: #0f172a;
        }
        .btn-secondary {
            background: #0b1120;
            color: #e5e7eb;
            border: 1px solid #1f2937;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 主内容区 */
        main {
            flex: 1;
            padding: 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }
        .page { display: none; }
        .page.active { display: block; }
        .hidden {
            display: none !important;
        }
        /* 题目列表页 */
        .problem-list h1 {
            margin-bottom: 24px;
            font-size: 24px;
        }
        .problem-table {
            width: 100%;
            border-collapse: collapse;
            background: #020617;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        .problem-table th, .problem-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #1e293b;
        }
        .problem-table th {
            background: #0f172a;
            color: #9ca3af;
            font-weight: 500;
        }
        .problem-table tr { cursor: pointer; transition: background .15s; }
        .problem-table tr:hover { background: #1e293b; }
        .solved-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(34,197,94,0.2);
            color: #4ade80;
            font-size: 12px;
        }
        /* 新增：未通过标签样式 */
        .failed-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(248,113,113,0.2);
            color: #fca5a5;
            font-size: 12px;
        }

        /* 题目详情页 */
        .problem-detail h1 {
            margin-bottom: 8px;
            font-size: 24px;
        }
        .problem-meta {
            color: #9ca3af;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .problem-desc {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .code-area {
            margin-bottom: 24px;
        }
        .code-area h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .code-area textarea {
            width: 100%;
            min-height: 300px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            color: #e5e7eb;
            font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            resize: vertical;
        }
        .code-area textarea:focus { border-color: #38bdf8; }
        .result-area {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
        }
        .result-area h3 { margin-bottom: 12px; }
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .status-AC { background: rgba(34,197,94,0.2); color: #4ade80; }
        .status-WA, .status-RE, .status-CE { background: rgba(248,113,113,0.2); color: #fca5a5; }
        .status-TLE, .status-MLE { background: rgba(250,204,21,0.2); color: #facc15; }
        .status-PENDING { background: rgba(148,163,184,0.2); color: #cbd5f5; }
        .status-UNKNOWN { background: rgba(148,163,184,0.2); color: #cbd5f5; }
        .result-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 12px;
        }
        .result-output {
            background: #0f172a;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow: auto;
        }

        /* 用户中心页 */
        .user-center h1 {
            margin-bottom: 24px;
            font-size: 24px;
        }
        .solved-list h2 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        .solved-item {
            padding: 12px 16px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background .15s;
        }
        .solved-item:hover { background: #1e293b; }

        /* 登录/注册弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal.hidden { display: none; }
        .modal-card {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            background: #020617;
            border-radius: 10px;
            border: 1px solid #1e293b;
        }
        .modal-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #9ca3af;
        }
        .field input {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #1e293b;
            background: #0f172a;
            color: #e5e7eb;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }
        .field input:focus { border-color: #38bdf8; }
        .modal-btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .switch-auth {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #9ca3af;
        }
        .switch-auth a {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
        }
        .error-tip {
            color: #fca5a5;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }

        /* 加载提示 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
<!-- 全局导航栏 -->
<header>
    <div class="logo" onclick="goToIndex()">操作系统 OJ 在线评测</div>
    <div class="auth-area">
        <span class="user-name hidden" id="navUserName" onclick="goToUserCenter()"></span>
        <button class="btn-secondary hidden" id="navLogoutBtn" onclick="logout()">退出登录</button>
        <button class="btn-secondary" id="navLoginBtn" onclick="openLoginModal()">登录</button>
        <button class="btn-primary" id="navRegisterBtn" onclick="openRegisterModal()">注册</button>
    </div>
</header>

<!-- 主内容区 -->
<main>
    <!-- 页面1：题目列表页 -->
    <div class="page active" id="problemListPage">
        <div class="problem-list">
            <h1>题目列表</h1>
            <table class="problem-table">
                <thead>
                <tr>
                    <th>题目编号</th>
                    <th>题目名称</th>
                    <th>时间限制</th>
                    <th>内存限制</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody id="problemTableBody">
                <tr><td colspan="5" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 页面2：题目详情页 -->
    <div class="page" id="problemDetailPage">
        <div class="problem-detail">
            <h1 id="detailProblemTitle">加载中...</h1>
            <div class="problem-meta" id="detailProblemMeta"></div>
            <div class="problem-desc" id="detailProblemDesc">加载中...</div>

            <div class="code-area">
                <h3>提交代码</h3>
                <label for="languageSelect" style="font-size:13px;color:#9ca3af;margin-bottom:8px;display:block;">编程语言</label>
                <select id="languageSelect" style="margin-bottom: 12px; padding: 6px 10px; border-radius: 6px; background: #020617; color: #e5e7eb; border: 1px solid #1e293b;">
                    <option value="cpp">C++ (g++)</option>
                </select>
                <label for="codeEditor" style="font-size:13px;color:#9ca3af;margin-bottom:8px;display:block;">代码内容</label>
                <textarea id="codeEditor" placeholder="// 在此输入你的代码"></textarea>
                <!-- 新增 AI 提示区域 -->
                <div id="aiCodeHint" style="margin-top:8px;font-size:12px;color:#38bdf8;"></div>

                <div class="btn-row" style="margin-top: 12px;">
                    <button class="btn-primary" id="detailSubmitBtn" onclick="submitCode()">提交评测</button>
                    <button class="btn-secondary" onclick="fillSampleCode()">填入示例代码</button>
                    <!-- 新增 AI 按钮 -->
                    <button class="btn-secondary" onclick="generateAICode()">AI 生成解题代码</button>
                </div>

            </div>

            <div class="result-area" id="detailResultArea" style="display: none;">
                <h3>评测结果</h3>
                <div id="detailResultStatus"></div>
                <div class="result-meta" id="detailResultMeta"></div>
                <div class="result-output" id="detailResultOutput"></div>
            </div>
        </div>
    </div>

    <!-- 页面3：用户中心页 -->
    <div class="page" id="userCenterPage">
        <div class="user-center">
            <h1 id="userCenterTitle">个人中心</h1>
            <div class="solved-list">
                <h2>已通过的题目</h2>
                <div id="userSolvedList">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 登录/注册弹窗 -->
<div class="modal hidden" id="authModal">
    <div class="modal-card">
        <h2 id="modalTitle">用户登录</h2>
        <div class="field">
            <label for="authUsername">用户名</label>
            <input id="authUsername" type="text" placeholder="请输入用户名" />
        </div>
        <div class="field" id="modalNicknameField" style="display: none;">
            <label for="authNickname">昵称</label>
            <input id="authNickname" type="text" placeholder="请输入昵称（选填）" />
        </div>
        <div class="field">
            <label for="authPassword">密码</label>
            <input id="authPassword" type="password" placeholder="请输入密码" />
        </div>
        <div class="field" id="modalConfirmPwdField" style="display: none;">
            <label for="authConfirmPassword">确认密码</label>
            <input id="authConfirmPassword" type="password" placeholder="请再次输入密码" />
        </div>
        <div class="modal-btn-row">
            <button class="btn-primary" id="modalSubmitBtn" onclick="handleAuthSubmit()">登录</button>
            <button class="btn-secondary" onclick="closeAuthModal()">取消</button>
        </div>
        <div class="switch-auth" id="modalSwitchAuth">
            还没有账号？<a onclick="switchToRegister()">立即注册</a>
        </div>
        <div class="error-tip" id="modalErrorTip"></div>
    </div>
</div>

<script>
    // ===================== 全局状态管理 =====================
    // ===================== 全局状态管理 =====================
    let currentUser = null;
    let problemList = [];
    let solvedProblemNums = [];    // 已通过的题目
    let submittedProblemNums = []; // 提交过的题目（含未通过）
    let currentProblem = null;
    let isLoginModal = true;


    // 新增防抖函数
    function debounce(fn, delay) {
        let timer = null;
        return function() {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, arguments), delay);
        };
    }
    // 新增 AI 代码提示逻辑
    async function handleAICodeHint() {
        if (!currentUser || !currentProblem) {
            // 未登录/无题目时清空提示
            document.getElementById('aiCodeHint').textContent = '';
            return;
        }

        const codeEditor = document.getElementById('codeEditor');
        const code = codeEditor.value || '';
        // 清洗代码：去除空白和注释，判断是否为有效代码
        const cleanCode = code
            .trim()
            .replace(/\/\/.*$/gm, '') // 去除单行注释
            .replace(/\/\*[\s\S]*?\*\//g, '') // 去除多行注释
            .trim();
        // 情况1：空代码/仅注释 → 直接显示空代码提示，不调用接口
        if (!cleanCode) {
            document.getElementById('aiCodeHint').textContent = 'AI 提示：请输入代码后提交评测';
            return;
        }

        // 情况2：有有效代码 → 调用AI接口
        try {
            const res = await fetch('/ai/code-completion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    problemNum: currentProblem.problemNum,
                    code: code,
                    // 补充problem参数（后端需要Problem对象）
                    userId: currentUser.id || 0
                })
            });
            if (!res.ok) {
                throw new Error(`请求失败（${res.status}）`);
            }
            // 修复：后端返回的是纯字符串，不是JSON对象
            const hintText = await res.text();
            // 渲染 AI 提示（兼容后端返回的空提示）
            document.getElementById('aiCodeHint').textContent = 'AI 提示：' + (hintText || '暂无提示');
        } catch (e) {
            console.log('AI 代码提示失败：', e);
            document.getElementById('aiCodeHint').textContent = 'AI 提示：暂无法获取提示，请检查网络';
        }
    }



    // ===================== 页面路由控制 =====================
    // 页面加载和hash变化时，切换页面
    window.addEventListener('load', () => {
        initAuthStatus();
        renderPage();

    // 新增：绑定编辑器输入事件（AI 实时提示）
    const codeEditor = document.getElementById('codeEditor');
    if (codeEditor) {
        codeEditor.addEventListener('input', debounce(handleAICodeHint, 500));
    }
    });

    window.addEventListener('hashchange', renderPage);

    // 根据hash渲染对应页面
    async function renderPage() {
        const hash = window.location.hash;
        // 隐藏所有页面
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));

        // 路由匹配
        if (hash === '' || hash === '#/') {
            // 题目列表页
            document.getElementById('problemListPage').classList.add('active');

            // 【核心新增】如果已登录，先加载用户状态，再渲染题目列表
            if (currentUser) {
                await loadUserProblemStatus();
            }

            await loadProblemList();
        } else if (hash.startsWith('#/problem/')) {
            // 题目详情页
            const problemNum = hash.replace('#/problem/', '');
            document.getElementById('problemDetailPage').classList.add('active');
            await loadProblemDetail(problemNum);
        } else if (hash === '#/user') {
            // 用户中心页
            if (!currentUser) {
                alert('请先登录');
                window.location.hash = '#/';
                return;
            }
            document.getElementById('userCenterPage').classList.add('active');
            await loadUserCenter();
        }
    }

    // 页面跳转方法
    function goToIndex() { window.location.hash = '#/'; }
    function goToProblemDetail(problemNum) { window.location.hash = `#/problem/${problemNum}`; }
    function goToUserCenter() { window.location.hash = '#/user'; }

    // ===================== 登录状态管理 =====================
    // 初始化登录状态
    async function initAuthStatus() {
        try {
            const res = await fetch('/user/current', { method: 'GET', credentials: 'include' });
            if (res.ok) {
                currentUser = await res.json();
                await loadUserProblemStatus(); // 【核心新增】页面刷新后，已登录用户自动加载状态
                updateAuthUI();
            }
        } catch (e) {
            currentUser = null;
            updateAuthUI();
        }
    }

    // 更新登录相关UI
    function updateAuthUI() {
        const userNameEl = document.getElementById('navUserName');
        const logoutBtn = document.getElementById('navLogoutBtn');
        const loginBtn = document.getElementById('navLoginBtn');
        const registerBtn = document.getElementById('navRegisterBtn');

        // 先重置所有元素的显示状态，避免样式冲突
        userNameEl.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        loginBtn.classList.remove('hidden');
        registerBtn.classList.remove('hidden');

        if (currentUser) {
            // 【已登录】：显示用户名、退出登录按钮，隐藏登录/注册按钮
            userNameEl.textContent = currentUser.nickname || currentUser.username;
            loginBtn.classList.add('hidden');
            registerBtn.classList.add('hidden');
        } else {
            // 【未登录】：隐藏用户名、退出登录按钮，显示登录/注册按钮
            userNameEl.classList.add('hidden');
            logoutBtn.classList.add('hidden');
        }
    }

    // 打开登录/注册弹窗
    function openLoginModal() {
        isLoginModal = true;
        resetAuthModal();
        document.getElementById('modalTitle').textContent = '用户登录';
        document.getElementById('modalSubmitBtn').textContent = '登录';
        document.getElementById('modalNicknameField').style.display = 'none';
        document.getElementById('modalConfirmPwdField').style.display = 'none';
        document.getElementById('modalSwitchAuth').innerHTML = '还没有账号？<a onclick="switchToRegister()">立即注册</a>';
        document.getElementById('authModal').classList.remove('hidden');
    }
    function openRegisterModal() {
        isLoginModal = false;
        resetAuthModal();
        document.getElementById('modalTitle').textContent = '用户注册';
        document.getElementById('modalSubmitBtn').textContent = '注册';
        document.getElementById('modalNicknameField').style.display = 'block';
        document.getElementById('modalConfirmPwdField').style.display = 'block';
        document.getElementById('modalSwitchAuth').innerHTML = '已有账号？<a onclick="switchToLogin()">立即登录</a>';
        document.getElementById('authModal').classList.remove('hidden');
    }
    function closeAuthModal() {
        document.getElementById('authModal').classList.add('hidden');
        resetAuthModal();
    }
    function resetAuthModal() {
        document.getElementById('authUsername').value = '';
        document.getElementById('authNickname').value = '';
        document.getElementById('authPassword').value = '';
        document.getElementById('authConfirmPassword').value = '';
        document.getElementById('modalErrorTip').textContent = '';
    }
    function switchToRegister() { openRegisterModal(); }
    function switchToLogin() { openLoginModal(); }

    // 处理登录/注册提交
    async function handleAuthSubmit() {
        const username = document.getElementById('authUsername').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        const nickname = document.getElementById('authNickname').value.trim();
        const confirmPwd = document.getElementById('authConfirmPassword').value.trim();
        const errorEl = document.getElementById('modalErrorTip');

        if (!username || !password) {
            errorEl.textContent = '用户名和密码不能为空';
            return;
        }

        try {
            if (isLoginModal) {
                // 登录
                const res = await fetch('/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || '登录失败');
                }
                currentUser = await res.json();
                await loadUserProblemStatus(); // 1. 先加载用户状态
                updateAuthUI();
                closeAuthModal();

                // 【核心新增】登录成功后，立即重新渲染题目列表，确保状态显示
                if (window.location.hash === '' || window.location.hash === '#/') {
                    // 如果当前就在题目列表页，直接重新加载
                    await loadProblemList();
                }

                alert('登录成功！');
            } else {
                // 注册
                if (password !== confirmPwd) {
                    errorEl.textContent = '两次输入的密码不一致';
                    return;
                }
                const res = await fetch('/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, nickname })
                });
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || '注册失败');
                }
                alert('注册成功！请登录');
                switchToLogin();
            }
        } catch (e) {
            errorEl.textContent = e.message;
        }
    }

    // 退出登录
    async function logout() {
        try {
            // 调用后端退出接口，销毁Session
            await fetch('/user/logout', {
                method: 'POST',
                credentials: 'include'
            });
        } catch (e) {
            console.warn('退出登录请求异常', e);
        }
        // 1. 彻底清除所有前端状态
        currentUser = null;
        solvedProblemNums = [];
        submittedProblemNums = [];
        currentProblem = null;

        // 2. 强制更新UI
        updateAuthUI();

        // 3. 跳转到首页，重置路由
        window.location.hash = '#/';

        // 4. 重新加载题目列表，清空状态
        await loadProblemList();

        alert('已退出登录');
    }

    // ===================== 题目列表页逻辑 =====================
    async function loadProblemList() {
        const tableBody = document.getElementById('problemTableBody');
        try {
            const res = await fetch('/problem/list');
            if (!res.ok) throw new Error('加载题目列表失败');
            problemList = await res.json();
            // 渲染表格
            tableBody.innerHTML = problemList.map(problem => `
            <tr onclick="goToProblemDetail('${problem.problemNum}')">
            <td>${problem.problemNum}</td>
            <td>${problem.problemName || '无标题'}</td>
            <td>${problem.timeLimit || 1000}ms</td>
            <td>${problem.memoryLimit || 64}MB</td>
            <td>
            ${solvedProblemNums.includes(problem.problemNum)
                ? '<span class="solved-tag">已通过</span>'
                : submittedProblemNums.includes(problem.problemNum)
                    ? '<span class="failed-tag">未通过</span>'
                    : '-'}
        </td>
    </tr>
`).join('');
        } catch (e) {
            tableBody.innerHTML = `<tr><td colspan="5" class="loading">加载失败：${e.message}</td></tr>`;
        }
    }

    // 加载用户的题目状态（已通过、已提交）
    async function loadUserProblemStatus() {
        if (!currentUser) return;
        try {
            const res = await fetch('/user/problem-status', { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                solvedProblemNums = data.solved || [];
                submittedProblemNums = data.submitted || [];
            }
        } catch (e) {
            console.warn('加载用户题目状态失败', e);
            throw e; // 抛出错误，让调用方捕获
        }
    }

    // ===================== 题目详情页逻辑 =====================
    // 加载题目详情
    async function loadProblemDetail(problemNum) {
        try {
            const res = await fetch(`/problem/detail/${problemNum}`);
            if (!res.ok) throw new Error('题目不存在');
            currentProblem = await res.json();
            // 渲染题目信息
            document.getElementById('detailProblemTitle').textContent = `${currentProblem.problemNum} ${currentProblem.problemName || '无标题'}`;
            document.getElementById('detailProblemMeta').textContent = `时间限制：${currentProblem.timeLimit || 1000}ms | 内存限制：${currentProblem.memoryLimit || 64}MB`;
            document.getElementById('detailProblemDesc').textContent = currentProblem.problemDescription || '暂无题目描述';
            // 重置代码框和结果区
            document.getElementById('codeEditor').value = '';
            document.getElementById('detailResultArea').style.display = 'none';
        } catch (e) {
            alert(e.message);
            window.location.hash = '#/';
        }
    }

    // 填入示例代码
    function fillSampleCode() {
        const sampleCode = `// 在此粘贴你的 C++ 程序
#include <bits/stdc++.h>
using namespace std;
int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    int a, b;
    if (!(cin >> a >> b)) return 0;
    cout << (a + b) << '\\n';
    return 0;
}`;
        document.getElementById('codeEditor').value = sampleCode;
        handleAICodeHint();
    }

    // 新增 AI 生成解题代码函数
    async function generateAICode() {
        if (!currentUser) {
            alert('请先登录');
            openLoginModal();
            return;
        }
        if (!currentProblem) {
            alert('题目加载失败');
            return;
        }
        const codeEditor = document.getElementById('codeEditor');
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = 'AI 生成中...';
        try {
            // 调用 AI 后端接口（需后端实现 /ai/generate-code）
            const res = await fetch('/ai/generate-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    problemNum: currentProblem.problemNum,
                    problemDesc: currentProblem.problemDescription
                })
            });
            if (!res.ok) throw new Error('AI 生成代码失败');
            const data = await res.json();
            // 将 AI 生成的代码填充到编辑器
            codeEditor.value = data.aiCode || '// AI 暂未生成有效代码';
            handleAICodeHint();
        } catch (e) {
            alert('AI 生成失败：' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'AI 生成解题代码';
        }
    }


    // 提交代码
    async function submitCode() {
        if (!currentUser) {
            alert('请先登录');
            openLoginModal();
            return;
        }
        if (!currentProblem) {
            alert('题目加载失败');
            return;
        }
        const code = document.getElementById('codeEditor').value.trim();
        const language = document.getElementById('languageSelect').value;
        if (!code) {
            alert('请输入代码');
            return;
        }

        const submitBtn = document.getElementById('detailSubmitBtn');
        const resultArea = document.getElementById('detailResultArea');
        const resultStatus = document.getElementById('detailResultStatus');
        const resultMeta = document.getElementById('detailResultMeta');
        const resultOutput = document.getElementById('detailResultOutput');

        // 禁用按钮，重置结果区
        submitBtn.disabled = true;
        resultArea.style.display = 'block';
        resultStatus.innerHTML = '<div class="status-pill status-PENDING">评测中，请稍候...</div>';
        resultMeta.innerHTML = '';
        resultOutput.textContent = '';

        try {
            // 提交代码
            const submitRes = await fetch('/judge/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    probNum: currentProblem.problemNum,
                    code: code,
                    language: language
                })
            });
            if (!submitRes.ok) {
                const errText = await submitRes.text();
                throw new Error(errText || '提交失败');
            }
            const submitData = await submitRes.json();
            const taskId = submitData.taskId;
            if (!taskId) throw new Error('提交失败，未获取到任务ID');

            // 轮询结果
            let result = null;
            for (let i = 0; i < 120; i++) {
                const res = await fetch(`/judge/result/${taskId}`, { credentials: 'include' });
                const data = await res.json();
                if (data.status !== 'PENDING') {
                    result = data;
                    break;
                }
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!result) throw new Error('等待评测结果超时');

            // 渲染结果
            const statusMap = {
                'ACCEPTED': { text: '通过 AC', class: 'status-AC' },
                'WRONG_ANSWER': { text: '答案错误 WA', class: 'status-WA' },
                'TIME_LIMIT_EXCEEDED': { text: '时间超限 TLE', class: 'status-TLE' },
                'MEMORY_LIMIT_EXCEEDED': { text: '内存超限 MLE', class: 'status-MLE' },
                'COMPILE_ERROR': { text: '编译错误 CE', class: 'status-CE' },
                'RUNTIME_ERROR': { text: '运行错误 RE', class: 'status-RE' },
                'UNKNOWN_ERROR': { text: '未知错误', class: 'status-WA' }
            };
            const statusInfo = statusMap[result.status] || { text: result.status, class: 'status-UNKNOWN' };
            resultStatus.innerHTML = `<div class="status-pill ${statusInfo.class}">${statusInfo.text}</div>`;
            resultMeta.innerHTML = `
                <span>用时：${result.usedTime || 0} ms</span>
                <span>内存：${result.usedMemory || 0} B</span>
            `;
            resultOutput.textContent = result.error || result.output || '无输出';

            resultOutput.textContent = result.output || result.error || '无输出';

            // 如果AC，刷新题目状态，重新渲染列表
            if (result.status === 'ACCEPTED') {
                await loadUserProblemStatus(); // 刷新用户状态
                await loadProblemList(); // 重新渲染题目列表，更新状态
            }
        } catch (e) {
            resultStatus.innerHTML = `<div class="status-pill status-WA">提交失败</div>`;
            resultOutput.textContent = e.message;
        } finally {
            submitBtn.disabled = false;
        }
    }
    // ===================== 用户中心页逻辑 =====================
    async function loadUserCenter() {
        document.getElementById('userCenterTitle').textContent = `${currentUser.nickname || currentUser.username} 的个人中心`;
        const solvedListEl = document.getElementById('userSolvedList');
        try {
            // 【核心修正】用正确的函数名加载用户已通过的题目
            await loadUserProblemStatus();

            if (solvedProblemNums.length === 0) {
                solvedListEl.innerHTML = '<div>暂无通过的题目</div>';
                return;
            }
            // 匹配题目信息
            if (problemList.length === 0) {
                const res = await fetch('/problem/list');
                problemList = await res.json();
            }
            // 渲染通过的题目
            solvedListEl.innerHTML = solvedProblemNums.map(num => {
                const problem = problemList.find(p => p.problemNum === num);
                return `
                <div class="solved-item" onclick="goToProblemDetail('${num}')">
                    ${num} ${problem?.problemName || '未知题目'}
                </div>
            `;
            }).join('');
        } catch (e) {
            solvedListEl.innerHTML = `<div>加载失败：${e.message}</div>`;
        }
    }

    // 点击弹窗外部关闭
    document.getElementById('authModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('authModal')) {
            closeAuthModal();
        }
    });



</script>
